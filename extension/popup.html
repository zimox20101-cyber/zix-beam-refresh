<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Zix Beam Tools</title>
    <style>
      :root {
        --spidey-red: #d1140a;
        --spidey-red-dark: #8a0a04;
        --spidey-blue: #1a4fbe;
        --spidey-blue-dark: #0b2b6f;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; width: 380px;
        font-family: "Bangers", "Impact", "Segoe UI", sans-serif;
        color: #fff;
        background:
          radial-gradient(circle at 20% 10%, var(--spidey-red) 0%, transparent 55%),
          radial-gradient(circle at 90% 90%, var(--spidey-blue) 0%, transparent 60%),
          #0a0a12;
      }
      .web-bg {
        position: absolute; inset: 0; pointer-events: none; opacity: 0.15;
        background-image:
          repeating-linear-gradient(45deg, #fff 0 1px, transparent 1px 22px),
          repeating-linear-gradient(-45deg, #fff 0 1px, transparent 1px 22px);
      }
      .wrap { position: relative; padding: 18px 18px 22px; }
      header {
        display: flex; align-items: center; gap: 10px;
        border-bottom: 2px solid var(--spidey-red);
        padding-bottom: 10px; margin-bottom: 14px;
      }
      header img { width: 42px; height: 42px; filter: drop-shadow(0 0 6px rgba(255,0,0,0.6)); }
      h1 { margin: 0; font-size: 22px; letter-spacing: 2px;
        text-shadow: 2px 2px 0 var(--spidey-red), 4px 4px 0 var(--spidey-blue); }
      .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
      .tab-btn {
        flex: 1;
        background: linear-gradient(180deg, var(--spidey-red), var(--spidey-red-dark));
        color: #fff; border: 2px solid #000; border-radius: 6px;
        padding: 8px; font-family: inherit; font-size: 15px;
        letter-spacing: 2px; cursor: pointer; text-transform: uppercase;
        box-shadow: 0 3px 0 #000; opacity: 0.7;
      }
      .tab-btn.active { opacity: 1; outline: 2px solid #fff; }
      .tab-btn:hover { filter: brightness(1.1); }
      .tab-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #000; }
      .panel {
        background: rgba(0,0,0,0.55); border: 2px solid var(--spidey-blue);
        border-radius: 8px; padding: 12px;
      }
      .panel[hidden] { display: none; }
      label { display: block; font-size: 13px; letter-spacing: 1.5px; margin-bottom: 6px; color: #ffd; }
      textarea, input[type="text"], select {
        width: 100%; background: #0a0a12; color: #7bff9d;
        border: 1px solid var(--spidey-blue); border-radius: 6px;
        padding: 8px; font-family: ui-monospace, Menlo, monospace; font-size: 12px;
      }
      textarea { min-height: 110px; resize: vertical; }
      .go {
        margin-top: 10px; width: 100%;
        background: linear-gradient(180deg, var(--spidey-blue), var(--spidey-blue-dark));
        color: #fff; border: 2px solid #000; border-radius: 6px;
        padding: 10px; font-family: inherit; font-size: 18px;
        letter-spacing: 3px; cursor: pointer; box-shadow: 0 3px 0 #000;
      }
      .go:disabled { opacity: 0.6; cursor: wait; }
      .status { margin-top: 10px; min-height: 18px; font-size: 12px; letter-spacing: 1px; }
      .status.ok { color: #7bff9d; }
      .status.err { color: #ff8b8b; }
      .status.pulse { animation: pulse 1.2s ease-in-out infinite; }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.02); }
      }
      .out-row {
        display: flex; align-items: center; justify-content: space-between;
        margin-top: 12px; margin-bottom: 6px;
      }
      .copy {
        background: var(--spidey-red); color: #fff; border: 1px solid #000;
        border-radius: 4px; font-family: inherit; letter-spacing: 1px;
        padding: 4px 10px; cursor: pointer; font-size: 12px;
      }
      .row { display: flex; gap: 6px; }
      .row > * { flex: 1; }
      .locked-msg { text-align: center; padding: 20px 10px; font-size: 14px; letter-spacing: 1.5px; color: #ffd; }
      .discord {
        margin-top: 12px; text-align: center;
      }
      .discord a {
        display: inline-block;
        color: #fff; background: #5865F2; text-decoration: none;
        padding: 8px 14px; border-radius: 6px; border: 2px solid #000;
        font-size: 13px; letter-spacing: 1px; box-shadow: 0 3px 0 #000;
      }
      .discord a:hover { filter: brightness(1.1); }
      .discord a:active { transform: translateY(2px); box-shadow: 0 1px 0 #000; }
      footer { margin-top: 14px; text-align: center; font-size: 10px; letter-spacing: 2px; opacity: 0.6; }
    </style>
  </head>
  <body>
    <div class="web-bg"></div>
    <div class="wrap">
      <header>
        <img src="icon.png" alt="Zix Beam Tools" />
        <h1>Zix Beam Tools</h1>
      </header>

      <div class="tabs">
        <button class="tab-btn active" data-tab="session">Session</button>
        <button class="tab-btn" data-tab="key">Key</button>
      </div>

      <section class="panel" id="panel-session">
        <div id="session-locked" class="locked-msg" hidden>
          Locked. Activate a key in the KEY tab to unlock.
        </div>
        <div id="session-content">
          <label for="cookie">Paste .ROBLOSECURITY cookie</label>
          <textarea id="cookie" placeholder="_|WARNING:-DO-NOT-SHARE-THIS...|_..."></textarea>
          <button class="go" id="refresh-btn">REFRESH SESSION</button>
          <div class="status" id="status"></div>

          <div class="out-row">
            <label style="margin:0">Refreshed cookie</label>
            <button class="copy" id="copy-btn">COPY</button>
          </div>
          <textarea id="output" readonly placeholder="Refreshed cookie appears here..."></textarea>
        </div>
      </section>

      <section class="panel" id="panel-key" hidden>
        <label>Key status</label>
        <div id="key-status-box" style="padding:8px;background:#0a0a12;border:1px solid var(--spidey-blue);border-radius:6px;font-size:12px;font-family:ui-monospace,Menlo,monospace;color:#7bff9d;min-height:36px;">No active key.</div>

        <div class="out-row"><label style="margin:0">Request a key</label></div>
        <div class="row">
          <select id="key-duration">
            <option value="1d">1 Day</option>
            <option value="1w">1 Week</option>
            <option value="lifetime">Lifetime</option>
          </select>
          <button class="copy" id="request-key-btn">REQUEST</button>
        </div>
        <div class="status" id="key-status"></div>

        <div class="out-row"><label style="margin:0">Redeem key</label></div>
        <div class="row">
          <input type="text" id="redeem-key" placeholder="ZIX-XXXX-XXXX-XXXX" />
          <button class="copy" id="redeem-btn">REDEEM</button>
        </div>
        <div class="status" id="redeem-status"></div>

        <div class="discord">
          <a id="discord-link" href="https://discord.gg/PxmRwExfw8" target="_blank" rel="noopener">Join Discord for support</a>
        </div>
      </section>

      <footer>WITH GREAT COOKIES COMES GREAT RESPONSIBILITY</footer>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
